<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yuyu Portfolio</title>
  <meta name="description" content="Yara Sherif — AI content creator. Cinematic 4K videos, ads, music videos and cartoon characters." />
  <meta name="theme-color" content="#0b0b0c" />
  <link rel="icon" href="og-image.jpg" />
  <!-- link preview (WhatsApp, Instagram, Facebook, X) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Yuyu Portfolio" />
  <meta property="og:title" content="Yuyu Portfolio — Yara Sherif" />
  <meta property="og:description" content="AI content creator · 1,000+ ads · Cinematic 4K videos, music videos, cartoons" />
  <meta property="og:url" content="https://yuyush2009-netizen.github.io/yuyu-portfolio/" />
  <meta property="og:image" content="https://yuyush2009-netizen.github.io/yuyu-portfolio/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Yuyu Portfolio cover — Yara Sherif, AI Content Creator" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Yuyu Portfolio — Yara Sherif" />
  <meta name="twitter:image" content="https://yuyush2009-netizen.github.io/yuyu-portfolio/og-image.jpg" />
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button class="lang" id="langToggle" type="button" aria-label="Switch language">ع</button>

  <main class="deck" id="deck">
    <!-- 1. COVER -->
    <section class="slide dark cover" id="top">
      <div class="in">
        <span class="cover-year script" dir="ltr">2026</span>
        <h1 class="cover-word" dir="ltr">PORTFOLIO</h1>
        <img class="cover-photo" id="coverPhoto" alt="" />
        <div class="cover-meta">
          <p class="script cover-name" dir="ltr" id="coverName"></p>
          <p class="cover-role" data-bind="role"></p>
        </div>
        <a class="work-btn cover-btn" id="coverWork" target="_blank" rel="noopener" data-i18n="allWork" hidden></a>
      </div>
    </section>

    <!-- 2. ABOUT -->
    <section class="slide white about" id="about">
      <div class="in">
        <div class="about-text">
          <h2 class="big" dir="ltr">ABOUT <span class="pink">ME</span></h2>
          <ul class="about-list" id="aboutList"></ul>
          <hr class="rule" />
          <p class="label" data-bind="toolsTitle"></p>
          <p class="tools" id="tools" dir="ltr"></p>
        </div>
        <div class="about-panel"><img id="aboutPhoto" alt="" /></div>
      </div>
    </section>

    <!-- 3. SKILLS -->
    <section class="slide dark skills" id="skills">
      <div class="in">
        <div>
          <h2 class="big pink" dir="ltr">SKILLS</h2>
          <div class="features" id="features"></div>
        </div>
        <div class="pills" id="pills"></div>
      </div>
    </section>

    <!-- CASES are inserted here -->
    <template id="caseTpl">
      <section class="slide case" role="button" tabindex="0">
        <div class="in">
          <div class="case-text">
            <div class="case-head" dir="ltr">
              <h2 class="big pink">CASE</h2>
              <span class="script case-script" dir="ltr"></span>
            </div>
            <p class="case-meta"><b class="lbl-project"></b> <span class="project"></span></p>
            <p class="case-meta"><b class="lbl-role"></b> <span class="role"></span></p>
            <a class="work-btn case-btn" target="_blank" rel="noopener" hidden></a>
          </div>
          <div class="case-media"></div>
        </div>
      </section>
    </template>

    <!-- 10. CONTACT -->
    <section class="slide dark contact" id="contact">
      <div class="in">
        <div class="contact-text">
          <h2 class="big pink" dir="ltr">CONTACT ME</h2>
          <div class="qrs" id="qrs"></div>
          <a class="mail" id="mailLink" dir="ltr"></a>
          <a class="mail" id="phoneLink" dir="ltr" target="_blank" rel="noopener" hidden></a>
          <p class="cta pink" data-i18n="cta"></p>
          <a class="work-btn" id="contactWork" target="_blank" rel="noopener" data-i18n="allWork" hidden></a>
        </div>
        <img class="contact-photo" id="contactPhoto" alt="" />
      </div>
    </section>
  </main>

  <footer class="foot">© <span id="year"></span> <span data-bind="name"></span></footer>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" hidden>
    <div class="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
      <button class="lb-close" id="lbClose" type="button" aria-label="Close">✕</button>
      <div class="lb-head">
        <h3 dir="ltr"><span class="pink">CASE</span> <span class="script" id="lbScript"></span></h3>
        <p id="lbTitle"></p>
      </div>
      <div class="lb-gallery" id="lbGallery"></div>
    </div>
  </div>

  <script src="vendor/qrcode.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
